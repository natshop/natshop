<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nati shop — Logos, ebooks and courses</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EA;--ink:#14201F;--mute:#55625F;--card:#FAFBF8;--line:#cdd5cc;--acc:#E9A21B;--deep:#0F3D3E;--plum:#5B2A4E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101816;--ink:#E8EEE9;--mute:#9AA9A5;--card:#17221F;--line:#2a3a36}}
:root[data-theme="dark"]{--bg:#101816;--ink:#E8EEE9;--mute:#9AA9A5;--card:#17221F;--line:#2a3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'DM Sans',system-ui,sans-serif;min-height:100%}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(2.3rem,7vw,4.4rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h3{font-size:1.1rem;font-weight:500;line-height:1.25}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--deep);color:#F4F1E8}
header a{color:inherit}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px;font-size:.85rem;border-bottom:1px solid #ffffff26}
.strip a{text-decoration:none;margin-left:auto}
.mast{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:18px;padding-bottom:0}
.brand{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;text-decoration:none;letter-spacing:-.04em}
.brand i{display:inline-block;width:.28em;height:.28em;background:var(--acc);border-radius:50%;margin-left:4px}
nav{display:flex;gap:22px;overflow-x:auto;max-width:100%}
nav a{padding:10px 2px;text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{border-bottom-color:var(--acc);color:var(--acc)}
header .cartbtn{border-color:#F4F1E8;color:#F4F1E8}
.photo{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.cartbtn{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:99px;padding:6px 13px;font:700 .9rem 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
section{padding:48px 0}
.hero{display:grid;gap:36px;padding:48px 0 32px}
@media(min-width:820px){.hero{grid-template-columns:1.1fr 1fr;align-items:center}}
.hero p{max-width:46ch;color:var(--mute);font-size:1.1rem;margin:18px 0 26px}
.btn{display:inline-block;background:var(--deep);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:700 1rem 'DM Sans',sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink);margin-left:8px}
.btn.acc{background:var(--acc);color:#14201F}
.specimen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.specimen svg,.card svg{display:block;width:100%;height:auto;border-radius:6px}
.specimen svg:nth-child(1){grid-row:span 1}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--mute)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .b p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:700}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:7px 14px;font:700 .9rem 'DM Sans',sans-serif;cursor:pointer}
.add[disabled]{background:var(--line);color:var(--mute);cursor:default}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{border:1.5px solid var(--line);background:none;color:var(--ink);padding:6px 14px;border-radius:99px;font:500 .95rem 'DM Sans',sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.band{background:var(--deep);color:#F4F1E8;border-radius:14px;padding:34px 24px;display:grid;gap:16px;justify-items:start}
.band p{margin:0;max-width:52ch;opacity:.85}
.two{display:grid;gap:32px}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:20px}
.stats b{display:block;font:800 2rem 'Bricolage Grotesque',sans-serif}
.stats span{color:var(--mute);font-size:.9rem}
.list{padding:0;margin:0;list-style:none;display:grid;gap:10px}
.list li{border-top:1px solid var(--line);padding-top:10px}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 4px}
input,textarea{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px;font:inherit}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#drawer{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);z-index:9;transform:translateX(100%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#drawer.open{transform:none}
#drawer .items{flex:1;overflow:auto;display:grid;gap:10px;align-content:start}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.item svg{width:56px;height:auto;border-radius:5px}
.item button{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;font:inherit;font-size:.85rem;padding:0}
.msg{background:var(--acc);color:#14201F;border-radius:8px;padding:10px 12px;font-size:.92rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

const PAL=[['#0F3D3E','#E9A21B'],['#5B2A4E','#F3C6A5'],['#E9A21B','#14201F'],['#2F6B5A','#F2E9D0'],['#C8472B','#F6E7C8'],['#1E3A6E','#9FD0C7']];
function art(i,kind,label){const [a,b]=PAL[i%6];let s='';const m=i%4;
if(kind==='logo'){s=[`<circle cx="100" cy="75" r="36" fill="${b}"/><circle cx="100" cy="75" r="18" fill="${a}"/>`,`<path d="M100 36 L146 112 H54Z" fill="${b}"/>`,`<rect x="62" y="37" width="46" height="46" fill="${b}"/><rect x="92" y="67" width="46" height="46" fill="${b}" opacity=".7"/>`,`<path d="M60 100a40 40 0 0 1 80 0Z" fill="${b}"/><rect x="60" y="106" width="80" height="10" fill="${b}"/>`][m]}
else if(kind==='book'){s=`<rect x="58" y="14" width="84" height="122" rx="4" fill="${b}"/><rect x="58" y="14" width="9" height="122" fill="#0003"/><rect x="76" y="34" width="52" height="7" fill="${a}"/><rect x="76" y="48" width="36" height="7" fill="${a}"/><circle cx="102" cy="100" r="16" fill="${a}"/>`}
else if(kind==='course'){s=`<rect x="24" y="24" width="152" height="102" rx="8" fill="${b}" opacity=".95"/><circle cx="100" cy="68" r="22" fill="${a}"/><path d="M93 58 L112 68 L93 78Z" fill="${b}"/><rect x="40" y="106" width="90" height="6" rx="3" fill="${a}"/><rect x="40" y="106" width="50" height="6" rx="3" fill="${a}" opacity=".6"/>`}
else{s=[`<circle cx="70" cy="80" r="46" fill="${b}"/><rect x="100" y="30" width="70" height="90" fill="${b}" opacity=".55"/>`,`<path d="M0 150 L70 40 L130 150Z" fill="${b}"/><circle cx="150" cy="40" r="22" fill="${b}" opacity=".6"/>`,`<rect x="30" y="30" width="60" height="90" fill="${b}"/><rect x="100" y="55" width="70" height="40" rx="20" fill="${b}" opacity=".6"/>`,`<path d="M20 110 Q100 -10 180 110Z" fill="${b}"/>`][m]}
return `<svg viewBox="0 0 200 150" role="img" aria-label="${label||'Sample image'}"><rect width="200" height="150" fill="${a}"/>${s}</svg>`}
const P=[
{id:1,t:'Starter logo kit',c:'Logos',p:49,d:'Five editable marks with colour and one-colour versions.'},
{id:2,t:'Monogram pack',c:'Logos',p:29,d:'Twenty-six letter marks you can recolour in minutes.'},
{id:3,t:'Café and food marks',c:'Logos',p:39,d:'Eight badges and labels for small food brands.'},
{id:4,t:'Pricing your design work',c:'Ebooks',p:15,d:'A 60-page guide to quotes, scope and saying no.'},
{id:5,t:'Brand colour handbook',c:'Ebooks',p:19,d:'Pick, test and document a palette that holds up.'},
{id:6,t:'Freelance starter workbook',c:'Ebooks',p:12,d:'Worksheets for your first five clients.'},
{id:7,t:'Logo design in a weekend',c:'Courses',p:79,d:'Six video lessons from sketch to finished mark.'},
{id:8,t:'Type for beginners',c:'Courses',p:59,d:'Learn pairing, spacing and hierarchy with exercises.'},
{id:9,t:'Sell your first download',c:'Courses',p:69,d:'Set up, price and launch a simple digital product.'}];
const W=[['Kebena Coffee','Identity and packaging'],['Abay Books','Logo and cover series'],['Lalibela Studio','Website and brand guide'],['Sheba Yoga','Logo and class posters'],['Tana Travel','Identity system'],['Meskel Market','Signage and labels']];
let cart=[],tab='All';
try{cart=JSON.parse(localStorage.getItem('natia-cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('natia-cart',JSON.stringify(cart))}catch(e){}};
const $=s=>document.querySelector(s);
const card=x=>`<article class="card">${art(x.id,x.c==='Logos'?'logo':x.c==='Ebooks'?'book':'course',x.t)}<div class="b"><h3>${x.t}</h3><p>${x.d}</p><div class="row"><span class="price">$${x.p}</span><button class="add" data-add="${x.id}" ${cart.includes(x.id)?'disabled':''}>${cart.includes(x.id)?'In cart':'Add to cart'}</button></div></div></article>`;
const work=(w,i)=>`<article class="card">${art(i,'work',w[0])}<div class="b"><h3>${w[0]}</h3><p>${w[1]}</p></div></article>`;
const pages={
'/':()=>`<div class="hero"><div><h1>Brand marks, books and lessons by one designer.</h1><p>I'm Nati. I design logos for small businesses and sell the tools I use as logo kits, ebooks and short courses.</p><a class="btn" href="#/shop">Shop products</a><a class="btn alt" href="#/work">See my work</a></div><img class="photo" src="${IMG}" alt="Black-and-white portrait of Nati leaning on a sink and facing a mirror"></div>
<section><div class="head"><div><h2>Popular downloads</h2><p>Instant access after checkout.</p></div><a href="#/shop">View all products</a></div><div class="grid">${[P[0],P[3],P[6]].map(card).join('')}</div></section>
<section><div class="head"><div><h2>Recent work</h2><p>Identity projects for small teams.</p></div><a href="#/work">All projects</a></div><div class="grid">${W.slice(0,3).map(work).join('')}</div></section>
<section><div class="band"><h2>Need a custom logo?</h2><p>Send a short brief and I'll reply within two working days with a quote and timeline.</p><a class="btn acc" href="#/contact">Start a project</a></div></section>`,
'/donate':()=>`<section class="two"><div><h2>Support Nati shop</h2><p style="color:var(--mute)">Like what I make? Send any amount with Telebirr. Every contribution goes into new logo kits, ebooks and lessons.</p></div><div class="band"><h3 style="font-size:1.3rem">Donate with Telebirr</h3><p>Open Telebirr, choose Send Money and enter this number.</p><b style="font:800 2rem 'Bricolage Grotesque',sans-serif">0991904062</b><button class="btn acc" data-copy="0991904062">Copy number</button></div></section>`,
'/work':()=>`<section><div class="head"><div><h2>Selected work</h2><p>Logos, packaging and small websites.</p></div></div><div class="grid">${W.map(work).join('')}</div></section>`,
'/shop':()=>{const cats=['All','Logos','Ebooks','Courses'];return `<section><div class="head"><div><h2>Shop</h2><p>Digital products. Download once, use forever.</p></div></div><div class="tabs">${cats.map(c=>`<button data-tab="${c}" class="${c===tab?'on':''}">${c}</button>`).join('')}</div><div class="grid">${P.filter(x=>tab==='All'||x.c===tab).map(card).join('')}</div></section>`},
'/about':()=>`<section class="two"><div><h1 style="font-size:clamp(2rem,5vw,3.2rem)">Hi, I'm Nati.</h1><div class="stats"><div><b>8 yrs</b><span>designing brands</span></div><div><b>120+</b><span>logos delivered</span></div><div><b>900</b><span>students taught</span></div></div><img class="photo" style="margin-top:24px" src="${IMG}" alt="Black-and-white portrait of Nati"></div><div><p>I started designing logos for friends' shops and kept going. Today I work with small businesses on identity, and I turn what I've learned into products anyone can use.</p><p>Everything in the shop is made to be practical: files you can open, edit and use the same day.</p><ul class="list"><li><b>Logo and identity design</b><br>Marks, colour, type and a one-page guide.</li><li><b>Digital products</b><br>Logo kits, ebooks and short video courses.</li><li><b>Workshops</b><br>Live sessions for teams and student groups.</li></ul></div></section>`,
'/contact':()=>`<section class="two"><div><h2>Let's talk</h2><p style="color:var(--mute)">Tell me about your project or ask about a product.</p><ul class="list"><li><b>Address</b><br>Addis Ababa, Ethiopia</li><li><b>Phone</b><br><a href="tel:+251991904062">+251 99 190 4062</a></li><li><b>Email</b><br><a href="mailto:nalemayehu975@gmail.com">nalemayehu975@gmail.com</a></li></ul></div><div><label for="n">Your name</label><input id="n"><label for="e">Email</label><input id="e" type="email"><label for="m">Message</label><textarea id="m" rows="5"></textarea><p><button class="btn" id="send">Send message</button></p><div id="ok"></div></div></section>`};
function route(){const r=(location.hash.slice(1)||'/');const f=pages[r]||pages['/'];$('#app').innerHTML=f();
$('#nav').innerHTML=[['/','Home'],['/work','Work'],['/shop','Shop'],['/about','About'],['/contact','Contact'],['/donate','Donate']].map(([h,t])=>`<a href="#${h}" class="${h===r?'on':''}">${t}</a>`).join('');window.scrollTo(0,0)}
function paint(){$('#cb').textContent=`Cart (${cart.length})`;const L=cart.map(id=>P.find(x=>x.id===id));
$('#items').innerHTML=L.length?L.map(x=>`<div class="item">${art(x.id,x.c==='Logos'?'logo':x.c==='Ebooks'?'book':'course',x.t)}<div><b>${x.t}</b><br><button data-rm="${x.id}">Remove</button></div><span class="price">$${x.p}</span></div>`).join(''):'<p style="color:var(--mute)">Your cart is empty. Browse the shop to add a logo kit, ebook or course.</p>';
$('#tot').innerHTML=L.length?`<div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px"><span>Total</span><span>$${L.reduce((s,x)=>s+x.p,0)}</span></div><button class="btn" style="width:100%" id="co">Check out</button><div id="cm"></div>`:''}
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.add){cart.push(+t.dataset.add);save();t.disabled=true;t.textContent='In cart';paint()}
if(t.dataset.rm){cart=cart.filter(i=>i!==+t.dataset.rm);save();paint();if(location.hash.includes('shop'))route()}
if(t.dataset.tab){tab=t.dataset.tab;route()}
if(t.dataset.copy){try{navigator.clipboard.writeText(t.dataset.copy);t.textContent='Copied'}catch(x){t.textContent=t.dataset.copy}}
if(t.id==='cb')$('#drawer').classList.add('open');
if(t.id==='cx')$('#drawer').classList.remove('open');
if(t.id==='co')$('#cm').innerHTML='<div class="msg" style="margin-top:10px"><b>Pay with Telebirr</b><br>Send $'+cart.reduce((s,i)=>s+P.find(x=>x.id===i).p,0)+' (or the equivalent in birr) to <b>0991904062</b>. Then email the payment receipt to nalemayehu975@gmail.com and your files will be sent once the payment is confirmed.<br><button class="btn" style="margin-top:8px" data-copy="0991904062">Copy number</button></div>';
if(t.id==='send'){const b=encodeURIComponent($('#m').value+'\n\n'+$('#n').value);location.href=`mailto:nalemayehu975@gmail.com?subject=Message%20for%20Nati%20shop&body=${b}`;$('#ok').innerHTML='<div class="msg">Your email app should open with the message ready to send.</div>'}});
